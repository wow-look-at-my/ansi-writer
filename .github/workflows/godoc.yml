name: Deploy GoDoc to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install pkgsite
        run: go install golang.org/x/pkgsite/cmd/pkgsite@latest

      - name: Generate documentation
        run: |
          # Start pkgsite serving the local module
          pkgsite -http=localhost:6060 &
          PKGSITE_PID=$!

          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6060 > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          MODULE="github.com/wow-look-at-my/ansi-writer"

          # Fetch the package page first to ensure it's loaded
          curl -sf "http://localhost:6060/${MODULE}" > /dev/null

          # Mirror the documentation site
          wget \
            --recursive \
            --no-parent \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --retry-connrefused \
            --directory-prefix=_site \
            --no-host-directories \
            "http://localhost:6060/${MODULE}"

          # Also grab top-level static assets (CSS/JS) that pkgsite serves
          wget \
            --recursive \
            --no-parent \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --retry-connrefused \
            --directory-prefix=_site \
            --no-host-directories \
            --accept='*.css,*.js,*.svg,*.png,*.ico' \
            "http://localhost:6060/static/" || true

          kill $PKGSITE_PID || true

          # Create a root index.html that redirects to the package docs
          cat > _site/index.html << 'HEREDOC'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=github.com/wow-look-at-my/ansi-writer">
            <link rel="canonical" href="github.com/wow-look-at-my/ansi-writer">
          </head>
          <body>
            <p><a href="github.com/wow-look-at-my/ansi-writer">Go to documentation</a></p>
          </body>
          </html>
          HEREDOC

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
